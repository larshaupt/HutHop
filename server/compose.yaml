# Lives on the Oracle VM at /opt/huthop/server/compose.yaml (cloned repo). See docs/deployment.md.
# Published by the website's Cloudflare tunnel (huthop.larshauptmann.com, behind Cloudflare Access): the container
# joins the website's Docker network, where cloudflared reaches it as huthop:8000. Port 8100 is for the host only.

# Without a name the project would be "server", the same as /opt/website/server, and
# `up --remove-orphans` in update.sh would remove the website's containers.
name: huthop

services:
  huthop:
    image: ghcr.io/larshaupt/huthop:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8100:8000"]
    networks: [default, tunnel]
    volumes: [../data:/app/data]
    # Changing data (hut corrections, edge exclusions) needs the admin password; refused until one is set.
    environment: [HUTHOP_REQUIRE_ADMIN=1]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-off jobs (server/refresh.sh): same image and data, no web server, so no ports or health check.
  # Only started with `docker compose run`; the profile keeps `up` in update.sh from starting it.
  refresh:
    image: ghcr.io/larshaupt/huthop:latest
    profiles: [jobs]
    volumes: [../data:/app/data]
    environment: [PYTHONUNBUFFERED=1]  # progress lines appear as they happen
    mem_limit: 3g  # a graph build needs ~2 GB; never more, whatever else runs on server2
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["python", "-m", "app.ingest.refresh"]

networks:
  tunnel:
    name: server_web  # created by /opt/website/server/compose.yaml (project "server")
    external: true
