[project]
name = "huthop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
