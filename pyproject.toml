[project]
name = "huthop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned so ruff upgrades don't change what CI checks: ruff's classic defaults plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
